<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DIP URJA POWER SOLUTIONS | Travel Reimbursement</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f8;
    color:#17202a;
}

/* HEADER */
.header{
    background:#ffffff;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    position:sticky;
    top:0;
    z-index:100;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;
    object-fit:contain;
}

.brand-name{
    font-size:20px;
    font-weight:800;
    letter-spacing:.5px;
}

.brand-sub{
    font-size:11px;
    color:#6b7280;
    margin-top:3px;
}

.menu-btn{
    background:#111827;
    color:white;
    border:none;
    border-radius:8px;
    padding:10px 14px;
    cursor:pointer;
}

/* NAV */
.nav{
    background:#111827;
    padding:10px;
    display:flex;
    gap:8px;
    overflow-x:auto;
}

.nav button{
    border:none;
    background:#263241;
    color:#fff;
    padding:11px 15px;
    border-radius:7px;
    white-space:nowrap;
    cursor:pointer;
}

.nav button.active{
    background:#d71920;
}

/* PAGE */
.container{
    max-width:1250px;
    margin:auto;
    padding:20px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* TITLE */
.page-title{
    margin-bottom:18px;
}

.page-title h1{
    font-size:26px;
}

.page-title p{
    color:#6b7280;
    margin-top:5px;
}

/* CARDS */
.card{
    background:#fff;
    border-radius:14px;
    padding:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    margin-bottom:20px;
}

.card-title{
    font-size:18px;
    font-weight:700;
    margin-bottom:15px;
}

/* FORM */
.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:700;
    color:#374151;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:8px;
    padding:12px;
    font-size:15px;
    outline:none;
    background:#fff;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#d71920;
}

textarea{
    min-height:80px;
    resize:vertical;
}

/* CALCULATION */
.calculation{
    background:#f8fafc;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:5px;
}

.calc-box{
    background:#fff;
    padding:13px;
    border-radius:8px;
    border:1px solid #e5e7eb;
}

.calc-label{
    font-size:11px;
    color:#6b7280;
}

.calc-value{
    font-size:21px;
    font-weight:800;
    margin-top:5px;
}

.amount{
    color:#138a36;
}

/* BUTTONS */
.btn{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
    font-size:14px;
}

.btn-primary{
    background:#d71920;
    color:white;
}

.btn-dark{
    background:#111827;
    color:white;
}

.btn-success{
    background:#16803c;
    color:white;
}

.btn-danger{
    background:#b91c1c;
    color:white;
}

.btn-warning{
    background:#d97706;
    color:white;
}

.btn-light{
    background:#e5e7eb;
    color:#111827;
}

.btn:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* DASHBOARD */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:#fff;
    border-radius:12px;
    padding:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.stat-title{
    font-size:12px;
    color:#6b7280;
}

.stat-value{
    font-size:27px;
    font-weight:800;
    margin-top:7px;
}

/* TABLE */
.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#111827;
    color:#fff;
    padding:12px;
    text-align:left;
    font-size:12px;
}

td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    font-size:13px;
}

tr:hover{
    background:#f9fafb;
}

/* BADGES */
.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:700;
}

.pending{
    background:#fff3cd;
    color:#856404;
}

.verified{
    background:#d1fae5;
    color:#065f46;
}

.rejected{
    background:#fee2e2;
    color:#991b1b;
}

.paid{
    background:#dbeafe;
    color:#1e40af;
}

/* FILTERS */
.filters{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-bottom:15px;
}

/* NOTICE */
.notice{
    background:#fff8e1;
    border-left:4px solid #d97706;
    padding:13px;
    border-radius:6px;
    margin-bottom:18px;
    font-size:13px;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    z-index:500;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:500px;
    border-radius:14px;
    padding:22px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

/* FOOTER */
.footer{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    padding:25px;
}

/* MOBILE */
@media(max-width:800px){

    .brand-name{
        font-size:15px;
    }

    .brand-sub{
        font-size:9px;
    }

    .container{
        padding:12px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .calculation{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .filters{
        grid-template-columns:1fr 1fr;
    }

    .page-title h1{
        font-size:22px;
    }

    .card{
        padding:15px;
    }
}

@media(max-width:480px){

    .stats{
        grid-template-columns:1fr 1fr;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .header{
        padding:10px;
    }

    .logo{
        width:40px;
        height:40px;
    }
}
</style>
</head>
