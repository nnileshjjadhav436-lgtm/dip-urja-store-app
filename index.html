<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DIP URJA POWER SOLUTIONS - Store Management</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        .header {
            background: #111827;
            color: white;
            padding: 22px 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        .header p {
            margin-top: 6px;
            font-size: 13px;
            color: #cbd5e1;
        }

        .container {
            padding: 16px;
            max-width: 700px;
            margin: auto;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0 15px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 8px;
        }

        .card .number {
            font-size: 22px;
            font-weight: bold;
        }

        .menu {
            margin-top: 24px;
            display: grid;
            gap: 12px;
        }

        .menu button {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 12px;
            background: white;
            text-align: left;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,0,0,0.07);
        }

        .menu button:active {
            transform: scale(0.98);
        }

        .footer {
            text-align: center;
            padding: 30px 10px;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>DIP URJA POWER SOLUTIONS</h1>
        <p>STORE & MATERIAL MANAGEMENT SYSTEM</p>
    </div>

    <div class="container">

        <div class="section-title">
            Store Dashboard
        </div>

        <div class="dashboard">

            <div class="card">
                <h3>Total Stock Items</h3>
                <div class="number">0</div>
            </div>

            <div class="card">
                <h3>Stock In Today</h3>
                <div class="number">₹ 0</div>
            </div>

            <div class="card">
                <h3>Stock Issued Today</h3>
                <div class="number">₹ 0</div>
            </div>

            <div class="card">
                <h3>Active Projects</h3>
                <div class="number">0</div>
            </div>

        </div>

        <div class="section-title" style="margin-top:28px;">
            Store Operations
        </div>

        <div class="menu">

            <button>📦 Material Master</button>

            <button>➕ Stock In / Material Receipt</button>

            <button>➖ Stock Out / Material Issue</button>

            <button>🏗️ Customer & Project Management</button>

            <button>👷 Team Leader Material</button>

            <button>🔄 Material Return</button>

            <button>📊 Stock Balance</button>

            <button>📋 Reports</button>

        </div>

        <div class="footer">
            DIP URJA POWER SOLUTIONS<br>
            Digital Store Management System
        </div>

    </div>

</body>
</html>
